jobs:
  upload_algolia:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Algolia CLI
        run: npm install -g @algolia/cli

      - name: Upload to Algolia
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
        run: |
          algolia upload --index-name=${{ secrets.ALGOLIA_INDEX_NAME }} --file=algolia.json
