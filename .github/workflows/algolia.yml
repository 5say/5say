name: Upload Algolia Index

on:
  push:
    branches:
      - main  # 或你的主分支名
    paths:
      - 'algolia.json'  # 当algolia.json文件发生变化时触发

jobs:
  upload_algolia:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # 也可以是你需要的版本

      - name: Install Algolia CLI
        run: npm install -g @algolia/cli

      - name: Upload algolia.json to Algolia index
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
        run: |
          algolia import \
            --app-id $ALGOLIA_APP_ID \
            --api-key $ALGOLIA_ADMIN_API_KEY \
            --index-name $ALGOLIA_INDEX_NAME \
            --file algolia.json \
            --debug
